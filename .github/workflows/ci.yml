name: LMMP CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  linux-x64:
    name: Linux-x64 (GCC, ${{ matrix.asm }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - lmmp_asm: AUTO
            asm: x64 ASM
          - lmmp_asm: GENERIC
            asm: generic
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Report toolchain
        run: |
          uname -m
          cmake --version | head -1
          gcc --version | head -1

      - name: Configure (Release, ${{ matrix.lmmp_asm }})
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DLMMP_BUILD_TESTS=ON \
            -DLMMP_BUILD_BENCHMARKS=OFF \
            -DLMMP_ASM=${{ matrix.lmmp_asm }}

      - name: Build
        run: cmake --build build --config Release --parallel 2

      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error

  linux-arm64:
    name: Linux-arm64 (GCC, ${{ matrix.asm }})
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - lmmp_asm: AUTO
            asm: arm64 ASM
          - lmmp_asm: GENERIC
            asm: generic
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Report toolchain
        run: |
          uname -m
          cmake --version | head -1
          gcc --version | head -1

      - name: Configure (Release, ${{ matrix.lmmp_asm }})
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DLMMP_BUILD_TESTS=ON \
            -DLMMP_BUILD_BENCHMARKS=OFF \
            -DLMMP_ASM=${{ matrix.lmmp_asm }}

      - name: Build
        run: cmake --build build --config Release --parallel 2

      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error

  macos-arm64:
    name: macOS-arm64 (Clang, ${{ matrix.asm }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - lmmp_asm: AUTO
            asm: arm64 ASM
          - lmmp_asm: GENERIC
            asm: generic
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Report toolchain
        run: |
          uname -m
          cmake --version | head -1
          clang --version | head -1

      - name: Configure (Release, ${{ matrix.lmmp_asm }})
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DLMMP_BUILD_TESTS=ON \
            -DLMMP_BUILD_BENCHMARKS=OFF \
            -DLMMP_ASM=${{ matrix.lmmp_asm }}

      - name: Build
        run: cmake --build build --config Release --parallel 3

      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error

  windows-x64:
    name: Windows-x64 (MinGW GCC, ${{ matrix.asm }})
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    strategy:
      fail-fast: false
      matrix:
        include:
          - lmmp_asm: AUTO
            asm: x64 ASM
          - lmmp_asm: GENERIC
            asm: generic
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSYS2 MinGW64
        uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-gcc-libs
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja

      - name: Report toolchain
        run: |
          uname -m
          cmake --version | head -1
          gcc --version | head -1

      - name: Configure (Release, ${{ matrix.lmmp_asm }})
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLMMP_BUILD_TESTS=ON \
            -DLMMP_BUILD_BENCHMARKS=OFF \
            -DLMMP_ASM=${{ matrix.lmmp_asm }}

      - name: Build
        run: cmake --build build --config Release --parallel 3

      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error
